<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de productos Biancolor: pintura interior, exterior, esmaltes, barnices, herramientas y más.">
  <title>Catálogo | Biancolor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navbar (reutilizable) -->
  <div id="site-navbar"></div>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
          <li class="breadcrumb-item active">Catálogo</li>
        </ol>
      </nav>
      <h1>Catálogo</h1>
      <p>Explora toda nuestra gama de productos</p>
    </div>
  </section>

  <!-- Catálogo -->
  <section class="section">
    <div class="container">
      <!-- Filtros -->
      <div id="catalogo-filters" class="catalog-filters animate-on-scroll">
        <!-- Se carga dinámicamente -->
      </div>

      <!-- Grid de productos -->
      <div id="catalogo-grid" class="row g-4">
        <!-- Se carga dinámicamente -->
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-3">Cargando catálogo...</p>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="section section-light">
    <div class="container text-center">
      <div class="animate-on-scroll">
        <h2>¿No encuentras lo que buscas?</h2>
        <p class="mb-5" style="font-size: var(--fs-lg); color: var(--color-gray-600);">Contacta con nosotros y te ayudaremos a encontrar el producto perfecto para tu proyecto.</p>
        <a href="contacto.html" class="btn btn-primary btn-lg">
          Contactar
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer (reutilizable) -->
  <div id="site-footer"></div>

  <!-- WhatsApp Float (reutilizable) -->
  <div id="site-whatsapp"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/catalogo.js"></script>
  <script>
    // Filtrar por categoría si viene en la URL
    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat');
      if (cat) {
        setTimeout(() => {
          const btn = document.querySelector(`[data-filter="${cat}"]`);
          if (btn) btn.click();
        }, 500);
      }
    });
  </script>
</body>
</html>
